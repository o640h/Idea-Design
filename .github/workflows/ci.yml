name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js and Dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: |
          pnpm exec next typegen
          pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Apply Migrations to a Clean Local Database
        run: pnpm exec supabase db start

      - name: Lint Database Schema
        run: pnpm exec supabase db lint

      - name: Test Database Policies
        run: pnpm exec supabase test db
